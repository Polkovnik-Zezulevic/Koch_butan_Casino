<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Коч Бутан Казино</title>
  <style>
    /* ===== СБРОС И ПЕРЕМЕННЫЕ ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    :root {
      --bg-deep: #0a0c10;
      --bg-panel: #12161f;
      --bg-card: #1a1f2b;
      --gold: #f5c542;
      --gold-light: #ffe28a;
      --gold-dark: #a67c00;
      --red: #e63946;
      --red-glow: #ff4d5a;
      --green: #2ecc71;
      --purple: #9b59b6;
      --blue: #3498db;
      --text: #eef2f9;
      --text-dim: #7d8899;
      --radius: 22px;
      --slot: 68px;
      --shadow-gold: 0 0 25px rgba(245, 197, 66, 0.4);
      --shadow-red: 0 0 25px rgba(230, 57, 70, 0.6);
    }

    body {
      background: radial-gradient(circle at 30% 10%, #1b2230 0%, #07090d 80%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      color: var(--text);
      overflow-x: hidden;
    }

    /* ===== ОСНОВНОЙ КОНТЕЙНЕР ===== */
    .app {
      width: 100%;
      max-width: 820px;
      background: linear-gradient(160deg, rgba(22, 28, 40, 0.92), rgba(10, 13, 20, 0.96));
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 36px;
      padding: 20px 16px 22px;
      border: 1px solid rgba(245, 197, 66, 0.18);
      box-shadow: 0 30px 60px -15px #000, inset 0 1px 1px rgba(255, 230, 150, 0.1);
      position: relative;
      overflow: hidden;
    }

    /* Декоративные блики */
    .app::before {
      content: '';
      position: absolute;
      top: -120px;
      right: -120px;
      width: 240px;
      height: 240px;
      background: radial-gradient(circle, rgba(245, 197, 66, 0.12), transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    /* ===== ШАПКА ===== */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .logo h1 {
      font-size: clamp(1.6rem, 6vw, 2.4rem);
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffe28a, #f5c542, #d4a000);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 40px rgba(245, 197, 66, 0.5);
      line-height: 1;
    }

    .logo .sub {
      font-size: clamp(0.6rem, 2.5vw, 0.75rem);
      letter-spacing: 6px;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-top: 3px;
      border-top: 1px solid rgba(245, 197, 66, 0.25);
      padding-top: 5px;
      display: inline-block;
    }

    /* ===== БАЛАНС (кликабельный) ===== */
    .balance-pill {
      background: linear-gradient(145deg, #2a3140, #1a1f2b);
      border: 1px solid rgba(245, 197, 66, 0.4);
      padding: 10px 20px;
      border-radius: 60px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 0 #0a0d12, 0 0 15px rgba(245, 197, 66, 0.15);
      font-weight: 800;
      font-size: clamp(1rem, 4vw, 1.3rem);
      color: var(--gold);
      position: relative;
      z-index: 5;
    }

    .balance-pill:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #0a0d12, 0 0 15px rgba(245, 197, 66, 0.15);
    }

    .balance-pill .coin {
      font-size: 1.3rem;
      filter: drop-shadow(0 0 6px gold);
    }

    .balance-pill .amount {
      color: var(--text);
      transition: color 0.2s;
    }

    .balance-pill .add-icon {
      color: var(--green);
      font-size: 1.2rem;
      font-weight: 900;
      opacity: 0.9;
      margin-left: 2px;
    }

    /* ===== МОДАЛКА ПОПОЛНЕНИЯ ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: 0.25s;
      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-box {
      background: linear-gradient(160deg, #1e2534, #12161f);
      border: 1px solid rgba(245, 197, 66, 0.4);
      border-radius: 28px;
      padding: 28px 22px 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 25px 60px #000, 0 0 40px rgba(245, 197, 66, 0.1);
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      text-align: center;
    }

    .modal-overlay.active .modal-box {
      transform: scale(1);
    }

    .modal-box h2 {
      color: var(--gold);
      font-size: 1.5rem;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .modal-box p {
      color: var(--text-dim);
      font-size: 0.85rem;
      margin-bottom: 20px;
    }

    .modal-input {
      width: 100%;
      background: #0d1118;
      border: 2px solid #2f3a4b;
      border-radius: 16px;
      padding: 16px 18px;
      font-size: 1.4rem;
      color: var(--gold);
      font-weight: 800;
      text-align: center;
      outline: none;
      transition: 0.2s;
      margin-bottom: 6px;
    }

    .modal-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 20px rgba(245, 197, 66, 0.3);
    }

    .modal-hint {
      font-size: 0.75rem;
      color: var(--red-glow);
      min-height: 18px;
      margin-bottom: 14px;
      font-weight: 600;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .modal-btn {
      flex: 1;
      padding: 14px;
      border-radius: 16px;
      border: none;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.15s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .modal-btn.primary {
      background: linear-gradient(145deg, #f5c542, #d4a000);
      color: #0a0c10;
      box-shadow: 0 4px 0 #7a5f00, 0 0 20px rgba(245, 197, 66, 0.4);
    }

    .modal-btn.primary:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #7a5f00, 0 0 20px rgba(245, 197, 66, 0.4);
    }

    .modal-btn.secondary {
      background: #252d3a;
      color: var(--text-dim);
      border: 1px solid #3f4a5a;
      box-shadow: 0 4px 0 #0f1219;
    }

    .modal-btn.secondary:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #0f1219;
    }

    /* ===== ВКЛАДКИ РЕЖИМОВ ===== */
    .mode-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }

    .mode-tab {
      background: linear-gradient(145deg, #1f2633, #151a23);
      border: 1px solid #2f3a4b;
      border-radius: 18px;
      padding: 12px 4px;
      color: var(--text-dim);
      font-weight: 700;
      font-size: clamp(0.7rem, 2.8vw, 0.9rem);
      cursor: pointer;
      transition: all 0.25s;
      text-align: center;
      box-shadow: 0 4px 0 #0a0d12;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .mode-tab .icon {
      font-size: clamp(1.2rem, 5vw, 1.6rem);
      line-height: 1;
    }

    .mode-tab.active {
      background: linear-gradient(145deg, #f5c542, #c9a000);
      color: #0a0c10;
      border-color: var(--gold-light);
      box-shadow: 0 0 25px rgba(245, 197, 66, 0.6), 0 4px 0 #7a5f00;
      transform: translateY(-2px);
    }

    .mode-tab.active .icon {
      filter: drop-shadow(0 0 4px rgba(0,0,0,0.4));
    }

    /* ===== ИГРОВОЕ ПОЛЕ ===== */
    .game-stage {
      background: linear-gradient(170deg, rgba(10, 13, 20, 0.9), rgba(18, 22, 31, 0.95));
      border-radius: 28px;
      padding: 20px 14px;
      margin-bottom: 16px;
      border: 1px solid rgba(245, 197, 66, 0.12);
      min-height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 40px rgba(0,0,0,0.6);
    }

    /* ===== СЛОТЫ ===== */
    .slots-row {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .slot {
      width: var(--slot);
      height: var(--slot);
      background: linear-gradient(145deg, #232c3a, #171d26);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      box-shadow: inset 0 -5px 0 #0a0d12, 0 8px 0 #080a0f, 0 0 20px rgba(0,0,0,0.8);
      border: 2px solid #3a4658;
      transition: transform 0.15s, border-color 0.2s;
      color: var(--gold);
      text-shadow: 0 0 14px currentColor;
      line-height: 1;
    }

    .slot.spinning {
      animation: slotBlink 0.1s infinite alternate;
      border-color: var(--gold);
    }

    @keyframes slotBlink {
      from { background: #232c3a; transform: scale(1); }
      to { background: #384556; transform: scale(0.96); }
    }

    .slot.win {
      animation: winPulse 0.5s ease 3;
      border-color: var(--gold-light);
      box-shadow: 0 0 30px rgba(245, 197, 66, 0.8);
    }

    @keyframes winPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    /* ===== АПГРЕЙД ===== */
    .upgrade-visual {
      display: flex;
      align-items: center;
      gap: 24px;
      font-size: 2rem;
      font-weight: 900;
    }

    .upgrade-visual .from {
      color: var(--text-dim);
      font-size: 1.6rem;
    }

    .upgrade-visual .arrow {
      color: var(--gold);
      font-size: 2.4rem;
      animation: arrowPulse 1.2s infinite;
    }

    @keyframes arrowPulse {
      0%, 100% { transform: translateX(0); opacity: 0.7; }
      50% { transform: translateX(8px); opacity: 1; }
    }

    .upgrade-visual .to {
      color: var(--gold);
      font-size: 2.4rem;
      text-shadow: 0 0 20px rgba(245, 197, 66, 0.6);
    }

    .multiplier-chip {
      margin-top: 16px;
      background: rgba(245, 197, 66, 0.12);
      border: 1px solid var(--gold-dark);
      padding: 8px 24px;
      border-radius: 60px;
      color: var(--gold);
      font-weight: 800;
      font-size: 1rem;
      letter-spacing: 1px;
    }

    /* ===== МИНЫ ===== */
    .mines-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 340px;
    }

    .mine-cell {
      aspect-ratio: 1;
      background: linear-gradient(145deg, #232c3a, #161b24);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 700;
      box-shadow: inset 0 -4px 0 #0a0d12, 0 5px 0 #080a0f;
      border: 1px solid #3a4658;
      cursor: pointer;
      transition: all 0.15s;
    }

    .mine-cell:active {
      transform: translateY(3px);
      box-shadow: inset 0 -1px 0 #0a0d12, 0 2px 0 #080a0f;
    }

    .mine-cell.revealed {
      box-shadow: inset 0 0 20px #000, 0 0 0 1px #4a5b72;
      border-color: #4a5b72;
      cursor: default;
      transform: none;
    }

    .mine-cell.mine {
      background: linear-gradient(145deg, #5c1a1a, #3a0e0e);
      border-color: #b13e3e;
      color: #ff6b6b;
      text-shadow: 0 0 10px red;
    }

    .mine-cell.gem {
      background: linear-gradient(145deg, #1a4d2e, #0e2b19);
      border-color: #3ba55d;
      color: #6bff9e;
      text-shadow: 0 0 10px #6bff9e;
    }

    /* ===== КЕЙСЫ ===== */
    .case-icon {
      font-size: 4.5rem;
      animation: caseFloat 1.6s ease-in-out infinite;
      filter: drop-shadow(0 0 25px rgba(245, 197, 66, 0.7));
    }

    @keyframes caseFloat {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-12px) rotate(2deg); }
    }

    /* ===== СТАВКА И КНОПКИ ===== */
    .controls-row {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
      align-items: stretch;
    }

    .bet-box {
      flex: 1;
      background: linear-gradient(145deg, #1a1f2b, #12161f);
      border: 1px solid #2f3a4b;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
    }

    .bet-box button {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: none;
      background: #2f3a4b;
      color: var(--text);
      font-size: 1.3rem;
      font-weight: 900;
      cursor: pointer;
      transition: 0.1s;
      box-shadow: 0 3px 0 #0a0d12;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bet-box button:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #0a0d12;
    }

    .bet-box .bet-value {
      font-size: 1.3rem;
      font-weight: 900;
      color: var(--gold);
      text-shadow: 0 0 10px rgba(245, 197, 66, 0.4);
      min-width: 50px;
      text-align: center;
    }

    /* ===== ГЛАВНАЯ КНОПКА ===== */
    .gamble-btn {
      width: 100%;
      background: linear-gradient(145deg, #e63946, #a01824);
      border: 1px solid #ff7b89;
      border-radius: 60px;
      padding: 18px 24px;
      color: white;
      font-size: clamp(1.1rem, 5vw, 1.5rem);
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: 0.12s;
      box-shadow: 0 8px 0 #63101a, 0 0 30px rgba(230, 57, 70, 0.5);
      text-shadow: 0 2px 6px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      position: relative;
      overflow: hidden;
    }

    .gamble-btn::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
      transition: left 0.6s;
    }

    .gamble-btn:hover::after {
      left: 100%;
    }

    .gamble-btn:active {
      transform: translateY(5px);
      box-shadow: 0 3px 0 #63101a, 0 0 30px rgba(230, 57, 70, 0.5);
    }

    .gamble-btn:disabled {
      opacity: 0.5;
      transform: translateY(5px);
      box-shadow: 0 3px 0 #63101a;
      pointer-events: none;
      filter: grayscale(0.6);
    }

    /* ===== ТОСТ ===== */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: linear-gradient(145deg, #1e2534, #12161f);
      color: var(--gold);
      padding: 14px 28px;
      border-radius: 60px;
      font-weight: 800;
      font-size: 0.95rem;
      border: 1px solid var(--gold);
      box-shadow: 0 15px 40px #000, 0 0 30px rgba(245, 197, 66, 0.3);
      z-index: 2000;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
      white-space: nowrap;
      max-width: 92vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ===== АДАПТИВ ===== */
    @media (max-width: 520px) {
      :root { --slot: 58px; }
      .slot { font-size: 2rem; border-radius: 16px; }
      .mode-grid { gap: 6px; }
      .mode-tab { padding: 10px 2px; border-radius: 14px; }
      .app { padding: 16px 12px 18px; border-radius: 28px; }
      .balance-pill { padding: 8px 16px; }
      .upgrade-visual { font-size: 1.6rem; gap: 16px; }
      .upgrade-visual .to { font-size: 2rem; }
    }

    @media (max-width: 380px) {
      :root { --slot: 48px; }
      .slot { font-size: 1.6rem; }
      .mode-tab .icon { font-size: 1.1rem; }
      .gamble-btn { padding: 14px 16px; }
      .mine-cell { font-size: 1.2rem; border-radius: 10px; }
    }

    /* Анимация появления */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .game-stage > * {
      animation: fadeUp 0.3s ease;
    }
  </style>
</head>
<body>

<div class="app">
  <!-- ШАПКА -->
  <div class="header">
    <div class="logo">
      <h1>Коч Бутан</h1>
      <div class="sub">Casino</div>
    </div>
    <div class="balance-pill" id="balancePill">
      <span class="coin">💰</span>
      <span class="amount" id="balanceDisplay">1000</span>
      <span class="add-icon">+</span>
    </div>
  </div>

  <!-- ВКЛАДКИ РЕЖИМОВ -->
  <div class="mode-grid">
    <button class="mode-tab active" data-mode="slots">
      <span class="icon">🎰</span>
      <span>Слоты</span>
    </button>
    <button class="mode-tab" data-mode="upgrade">
      <span class="icon">⬆️</span>
      <span>Апгрейд</span>
    </button>
    <button class="mode-tab" data-mode="mines">
      <span class="icon">💣</span>
      <span>Мины</span>
    </button>
    <button class="mode-tab" data-mode="cases">
      <span class="icon">📦</span>
      <span>Кейсы</span>
    </button>
  </div>

  <!-- ИГРОВОЕ ПОЛЕ -->
  <div class="game-stage" id="gameStage"></div>

  <!-- СТАВКА -->
  <div class="controls-row">
    <div class="bet-box">
      <button id="betMinus">−</button>
      <div class="bet-value" id="betDisplay">10</div>
      <button id="betPlus">+</button>
    </div>
  </div>

  <!-- ГЛАВНАЯ КНОПКА -->
  <button class="gamble-btn" id="gambleBtn">
    <span>🎲</span>
    <span>Let's Go Gambling</span>
  </button>
</div>

<!-- МОДАЛКА ПОПОЛНЕНИЯ -->
<div class="modal-overlay" id="depositModal">
  <div class="modal-box">
    <h2>Пополнение</h2>
    <p>Введите сумму (макс. 100)</p>
    <input type="number" class="modal-input" id="depositInput" placeholder="0" min="1" max="100">
    <div class="modal-hint" id="depositHint"></div>
    <div class="modal-actions">
      <button class="modal-btn secondary" id="depositCancel">Отмена</button>
      <button class="modal-btn primary" id="depositConfirm">Пополнить</button>
    </div>
  </div>
</div>

<!-- ТОСТ -->
<div class="toast" id="toast"></div>

<script>
  (function() {
    'use strict';

    // ===== СОСТОЯНИЕ =====
    let balance = 1000;
    let currentBet = 10;
    let currentMode = 'slots';
    let isBusy = false;
    let minesState = {
      active: false,
      minesCount: 3,
      revealed: [],
      minePositions: [],
      multiplier: 1.0
    };

    // DOM
    const balanceDisplay = document.getElementById('balanceDisplay');
    const balancePill = document.getElementById('balancePill');
    const betDisplay = document.getElementById('betDisplay');
    const gameStage = document.getElementById('gameStage');
    const gambleBtn = document.getElementById('gambleBtn');
    const modeTabs = document.querySelectorAll('.mode-tab');
    const toastEl = document.getElementById('toast');
    const depositModal = document.getElementById('depositModal');
    const depositInput = document.getElementById('depositInput');
    const depositHint = document.getElementById('depositHint');
    const depositConfirm = document.getElementById('depositConfirm');
    const depositCancel = document.getElementById('depositCancel');

    // ===== УТИЛИТЫ =====
    function showToast(msg, type = 'info') {
      toastEl.textContent = msg;
      toastEl.style.color = type === 'win' ? '#6bff9e' : type === 'lose' ? '#ff6b6b' : 'var(--gold)';
      toastEl.style.borderColor = type === 'win' ? '#3ba55d' : type === 'lose' ? '#b13e3e' : 'var(--gold)';
      toastEl.classList.add('show');
      clearTimeout(window._toastT);
      window._toastT = setTimeout(() => toastEl.classList.remove('show'), 2200);
    }

    function updateBalanceUI() {
      balanceDisplay.textContent = balance;
      // Анимация пульсации при изменении
      balanceDisplay.style.transform = 'scale(1.15)';
      balanceDisplay.style.color = 'var(--gold-light)';
      setTimeout(() => {
        balanceDisplay.style.transform = 'scale(1)';
        balanceDisplay.style.color = '';
      }, 200);
    }

    function updateBetUI() {
      betDisplay.textContent = currentBet;
    }

    function setBet(val) {
      if (val < 1) val = 1;
      if (val > balance) val = balance;
      if (val > 1000000) val = 1000000;
      currentBet = val;
      updateBetUI();
    }

    // ===== МОДАЛКА ПОПОЛНЕНИЯ =====
    balancePill.addEventListener('click', () => {
      depositModal.classList.add('active');
      depositInput.value = '';
      depositHint.textContent = '';
      depositInput.focus();
    });

    depositCancel.addEventListener('click', () => {
      depositModal.classList.remove('active');
    });

    depositModal.addEventListener('click', (e) => {
      if (e.target === depositModal) depositModal.classList.remove('active');
    });

    depositConfirm.addEventListener('click', () => {
      const raw = depositInput.value.trim();
      const num = Number(raw);
      if (!raw || isNaN(num) || num <= 0) {
        depositHint.textContent = 'Введите корректную сумму';
        return;
      }
      if (num > 100) {
        depositHint.textContent = '⚠️ Максимальная сумма пополнения — 100';
        return;
      }
      balance += Math.floor(num);
      updateBalanceUI();
      depositModal.classList.remove('active');
      showToast(`✅ Баланс пополнен на ${Math.floor(num)}`, 'win');
    });

    depositInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') depositConfirm.click();
    });

    function renderStage() {
      if (currentMode === 'slots') {
        gameStage.innerHTML = `

            <div class="slot" id="slot0">🍒</div>
            <div class="slot" id="slot1">🍋</div>
            <div class="slot" id="slot2">🍊</div>
          </div>
        `;
      } else if (currentMode === 'upgrade') {
        gameStage.innerHTML = `
          <div class="upgrade-visual">
            <span class="from">10</span>
            <span class="arrow">→</span>
            <span class="to">20</span>
          </div>
          <div class="multiplier-chip">x2 МНОЖИТЕЛЬ</div>
        `;
      } else if (currentMode === 'mines') {
        minesState.active = false;
        minesState.revealed = [];
        minesState.minePositions = [];
        minesState.multiplier = 1.0;
        renderMinesGrid();
      } else if (currentMode === 'cases') {
        gameStage.innerHTML = `
          <div class="case-icon">📦</div>
        `;
      }
      if (currentMode !== 'mines' || !minesState.active) {
        gambleBtn.innerHTML = '<span>🎲</span><span>Let\'s Go Gambling</span>';
      }
      gambleBtn.disabled = false;
      isBusy = false;
    }

    // ===== СЛОТЫ =====
    function spinSlots() {
      if (isBusy) return;
      if (balance < currentBet) { showToast('Недостаточно средств', 'lose'); return; }
      isBusy = true;
      balance -= currentBet;
      updateBalanceUI();
      gambleBtn.disabled = true;

      const symbols = ['🍒', '🍋', '🍊', '🍇', '💎', '7️⃣', '🔔', '⭐'];
      const slotEls = [
        document.getElementById('slot0'),
        document.getElementById('slot1'),
        document.getElementById('slot2')
      ];
      slotEls.forEach(el => { el.classList.add('spinning'); el.classList.remove('win'); });

      let ticks = 0;
      const interval = setInterval(() => {
        slotEls.forEach(el => {
          el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        });
        ticks++;
        if (ticks >= 14) {
          clearInterval(interval);
          const finals = [];
          slotEls.forEach(el => {
            const s = symbols[Math.floor(Math.random() * symbols.length)];
            el.textContent = s;
            finals.push(s);
            el.classList.remove('spinning');
          });

          let win = 0;
          if (finals[0] === finals[1] && finals[1] === finals[2]) {
            win = currentBet * 10;
            slotEls.forEach(el => el.classList.add('win'));
            showToast(`🎉 ДЖЕКПОТ! +${win}`, 'win');
          } else if (finals[0] === finals[1] || finals[1] === finals[2] || finals[0] === finals[2]) {
            win = currentBet * 2;
            showToast(`✨ Пара! +${win}`, 'win');
          } else {
            showToast('😢 Не повезло', 'lose');
          }

          if (win > 0) {
            balance += win;
            updateBalanceUI();
          }
          isBusy = false;
          gambleBtn.disabled = false;
        }
      }, 75);
    }
